name: CI & Cache Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Cachix
        uses: cachix/cachix-action@v16
        with:
          name: rogernavelsaker
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check Nanoserver update targets
        # Scope CI to the appliance artifacts; the full flake check currently
        # realizes an unrelated upstream Autofirma Maven fixed-output hash.
        run: >-
          nix build
          .#checks.x86_64-linux.nanoserver-01-slot-uki
          .#checks.x86_64-linux.workflow-lint
          .#checks.x86_64-linux.host-platform
          .#checks.x86_64-linux.flux-manifests
          .#checks.x86_64-linux.nanoserver-v4-asset-size
          .#packages.x86_64-linux.nanoserver-01-update-bundle
          .#packages.x86_64-linux.nanoserver-01-update-v4-bundle
          --no-link --accept-flake-config
