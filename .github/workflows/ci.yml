name: CI & Cache Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Cachix
        uses: cachix/cachix-action@v16
        with:
          name: rogernavelsaker
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check active project targets
        run: >-
          nix build
          .#checks.x86_64-linux.resource-tree
          .#checks.x86_64-linux.workflow-lint
          .#checks.x86_64-linux.herdr-server
          .#checks.x86_64-linux.graft-secret-render
          .#checks.x86_64-linux.nanoserver-workload-nix
          .#checks.x86_64-linux.nanoserver-workload-podman
          --no-link --accept-flake-config
