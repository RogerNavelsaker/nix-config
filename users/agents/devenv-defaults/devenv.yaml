      nixpkgs:
        follows: agentToolsNixpkgs
  mulch:
    url: github:RogerNavelsaker/nixpkg-mulch/890deec46fbee6334ceffd022e7069ff19c69da7
    inputs:
      nixpkgs:
        follows: agentToolsNixpkgs
  terrarium:
